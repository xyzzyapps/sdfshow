[project]
name = "sdfshow"
dynamic = ["version"]
description = "Render signed-distance-field shows from Markdown: tempo, bars and tracks drive a VapourSynth GLSL raymarcher."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vapoursynth", "vs-placebo"]
license = { file = "LICENSE.md" }

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[project.scripts]
sdfshow = "sdfshow.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "FURB"]

[tool.setuptools]
packages = ["sdfshow"]

[tool.setuptools.dynamic]
version = { attr = "sdfshow.__version__" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"